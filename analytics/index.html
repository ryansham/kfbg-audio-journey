<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light">
<title>Audio Journey 數據簡報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 淺色單一主題。刻意不做深色版：這是一份給團隊傳閱、也會被列印的報告，
   單一外觀讓每個人看到的、以及貼進簡報裡的，都是同一個樣子。
   所有顏色都明寫，不依賴瀏覽器主題。 */
:root{
  --page:#EFEAE1; --card:#F7F3EC; --card-2:#E9E4DA;
  --ink:#1E2418; --ink-2:#565E4B; --ink-3:#7A7A6A;
  --rule:#D8D3CB; --rule-soft:#E2DDD4;
  --data-strong:#3D6226; --data-pale:#8FB877;
  --accent:#8A6414; --accent-line:#B0801F; --accent-bg:rgba(176,128,31,0.10);
  --f0:#8FB877; --f1:#6A9A4E; --f2:#4C7A30; --f3:#3D6226; --f4:#2E4A1C;
  --serif:'Noto Serif TC',Georgia,'Songti TC',serif;
  --sans:'DM Sans','Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased;}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:3px;border-radius:4px;}
html[lang="en"] body{line-height:1.68;}

#app[hidden]{display:none;}

/* ── 語言切換 ── */
.langsw{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;background:var(--card);flex-shrink:0;}
.langsw button{font-family:var(--sans);font-size:.78rem;font-weight:500;padding:5px 13px;border:none;background:none;color:var(--ink-3);cursor:pointer;line-height:1.7;}
.langsw button[aria-pressed="true"]{background:var(--data-strong);color:var(--card);}
.langsw button:hover:not([aria-pressed="true"]){color:var(--ink);}

.wrap{max-width:940px;margin:0 auto;padding:40px 20px 72px;display:flex;flex-direction:column;gap:34px;}

/* ── HEADER ── */
header{display:flex;flex-direction:column;gap:12px;padding-bottom:26px;border-bottom:2px solid var(--ink);}
.htop{display:flex;justify-content:space-between;align-items:center;gap:16px;}
.eyebrow{font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1.2;text-wrap:balance;letter-spacing:.01em;}
.stamp{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:.83rem;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.stamp b{font-weight:500;color:var(--ink);}
#refresh{font-family:var(--sans);font-size:.83rem;font-weight:500;padding:6px 15px;border:1px solid var(--rule);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
#refresh:hover:not(:disabled){border-color:var(--data-strong);color:var(--data-strong);}
#refresh:disabled{opacity:.55;cursor:progress;}
#refresh svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
#rstatus{font-size:.8rem;color:var(--ink-3);}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:500;padding:2px 10px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-3);}
.pill::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--ink-3);}
.pill.live{color:var(--data-strong);border-color:var(--data-pale);}
.pill.live::before{background:var(--data-strong);}

/* ── 日期範圍 ── */
.rangebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 15px;}
.rangebar .lb{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;background:var(--page);}
.seg button{font-family:var(--sans);font-size:.82rem;font-weight:500;padding:6px 14px;
  border:none;background:none;color:var(--ink-2);cursor:pointer;line-height:1.6;}
.seg button[aria-pressed="true"]{background:var(--data-strong);color:var(--card);}
.seg button:hover:not([aria-pressed="true"]):not(:disabled){color:var(--ink);}
.seg button:disabled{opacity:.45;cursor:default;}
.dates{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-2);}
/* 🔴 16px 是 iOS 的分界線。細過 16px，Safari 一 focus 就會把整版放大，
   之後版面一直歪著，同事要自己縮返。 */
.dates input[type="date"]{font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--page);border:1px solid var(--rule);border-radius:8px;
  padding:4px 9px;min-height:34px;line-height:1.4;}
.dates input:disabled{opacity:.5;}
#r-apply{font-family:var(--sans);font-size:.82rem;font-weight:500;padding:6px 15px;
  border:1px solid var(--rule);border-radius:99px;background:var(--page);color:var(--ink);cursor:pointer;}
#r-apply:hover:not(:disabled){border-color:var(--data-strong);color:var(--data-strong);}
#r-apply:disabled{opacity:.4;cursor:default;}
#rmsg{flex-basis:100%;font-size:.83rem;color:var(--accent);}
#rmsg:empty{display:none;}
#rhint{flex-basis:100%;font-size:.8rem;color:var(--ink-3);}
#rhint:empty{display:none;}
/* 換範圍期間，畫面上的數字仍然是舊那一段。調暗它，免得有人讀住舊數當新數。 */
body.busy #body-slot{opacity:.42;}
body.busy #body-slot,#body-slot{transition:opacity .15s ease;}

/* ── SECTION ── */
section{display:flex;flex-direction:column;gap:16px;}
h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;line-height:1.4;display:flex;align-items:baseline;gap:12px;}
h2::after{content:"";flex:1;height:1px;background:var(--rule);}
.lede{font-size:.96rem;color:var(--ink-2);max-width:64ch;}
.lede strong{font-weight:500;color:var(--ink);}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:5px;}
.tile .k{font-size:.76rem;letter-spacing:.06em;color:var(--ink-3);}
.tile .v{font-family:var(--serif);font-weight:700;font-size:2.15rem;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--data-strong);}
.tile .n{font-size:.78rem;color:var(--ink-3);}

.note{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;}
.note h2{font-size:1.06rem;color:var(--accent);}
.note h2::after{background:var(--accent-line);opacity:.4;}
.note ol{padding-left:1.3em;display:flex;flex-direction:column;gap:9px;font-size:.92rem;color:var(--ink);}
.note li::marker{color:var(--accent);font-weight:500;}

.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;}
.chart{overflow-x:auto;}
.chart svg{display:block;width:100%;min-width:440px;height:auto;}
.grid{stroke:var(--rule-soft);stroke-width:1;}
.ax{fill:var(--ink-3);font-family:var(--sans);font-size:11px;font-variant-numeric:tabular-nums;}
.val{fill:var(--ink-2);font-family:var(--sans);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;}
.d-strong{fill:var(--data-strong);}
.d-pale{fill:var(--data-pale);}
.f0{fill:var(--f0);}.f1{fill:var(--f1);}.f2{fill:var(--f2);}.f3{fill:var(--f3);}.f4{fill:var(--f4);}
.flab{fill:var(--ink);font-family:var(--sans);font-size:12.5px;}
.fval{fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.fpct{fill:var(--ink-3);font-weight:400;font-size:11.5px;}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.83rem;color:var(--ink-2);}
.legend span{display:flex;align-items:center;gap:7px;}
.sw{width:13px;height:13px;border-radius:3px;flex-shrink:0;}
.cap{font-size:.82rem;color:var(--ink-3);max-width:66ch;}

/* ── 提示框 ──
   本來靠 SVG 的 <title>：要停一秒才出、樣式改不了、觸控螢幕完全不會出現，
   而且只有那條窄柱本身收得到。這裡自己畫一個，整條 column 都收 hover，
   並且把一條柱裡兩截的數字分開列出來。 */
#tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;
  transform:translateY(3px);transition:opacity .12s ease,transform .12s ease;
  background:var(--card);color:var(--ink);border:1px solid var(--rule);
  border-radius:10px;padding:10px 12px;
  font-family:var(--sans);font-weight:400;font-size:.82rem;line-height:1.5;
  box-shadow:0 8px 24px rgba(30,36,24,.16);max-width:252px;}
#tip.on{opacity:1;transform:translateY(0);}
#tip .th{font-weight:500;margin-bottom:6px;}
#tip .tr{display:flex;align-items:center;gap:9px;white-space:nowrap;}
#tip .tr i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
#tip .tr .lb{flex:1;color:var(--ink-2);}
#tip .tr .vv{font-weight:500;font-variant-numeric:tabular-nums;}
#tip .tt{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule-soft);}
/* 整條 column／整行的透明感應區，唔使準確指住嗰條窄柱 */
.hit{fill:transparent;cursor:pointer;}
.hit:focus-visible{fill:rgba(61,98,38,.09);outline:2px solid var(--accent-line);outline-offset:-1px;}
@media (prefers-reduced-motion:reduce){#tip{transition:none;}}
@media print{#tip{display:none!important;}}

.tw{overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:340px;font-size:.9rem;font-variant-numeric:tabular-nums;}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule-soft);}
th{font-weight:500;font-size:.76rem;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;}
td.n,th.n{text-align:right;}
td.n{font-weight:500;}
tr:last-child td{border-bottom:none;}
tbody tr.hi td{background:var(--card-2);}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-3);margin-left:7px;vertical-align:1px;}

.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:12px;}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px;}
.fact{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:17px 18px;display:flex;flex-direction:column;gap:3px;}
.fact .v{font-family:var(--serif);font-size:1.45rem;font-weight:700;color:var(--data-strong);font-variant-numeric:tabular-nums;line-height:1.2;}
.fact .k{font-size:.85rem;color:var(--ink-2);}
.fact .n{font-size:.76rem;color:var(--ink-3);}

.acts{display:flex;flex-direction:column;gap:11px;counter-reset:a;}
.act{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:17px 20px;display:flex;gap:15px;align-items:flex-start;}
.act::before{counter-increment:a;content:counter(a);font-family:var(--serif);font-weight:700;font-size:.95rem;color:var(--card);background:var(--data-strong);width:25px;height:25px;border-radius:99px;display:grid;place-items:center;flex-shrink:0;margin-top:2px;}
.act p{font-size:.93rem;}
.act b{font-weight:500;}

.state{background:var(--card);border:1px dashed var(--rule);border-radius:14px;padding:30px 24px;text-align:center;color:var(--ink-3);font-size:.9rem;}
.state.bad{border-color:var(--accent-line);color:var(--accent);border-style:solid;}

footer{border-top:1px solid var(--rule);padding-top:20px;font-size:.8rem;color:var(--ink-3);display:flex;flex-direction:column;gap:5px;}
@media (max-width:560px){.wrap{padding:28px 15px 56px;gap:28px;}.tile .v{font-size:1.85rem;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@media print{
  body{background:#fff;}
  .langsw,#refresh,#rstatus,.rangebar{display:none;}
  .card,.tile,.fact,.act,.note{break-inside:avoid;}
}
</style>
</head>
<body>

</div>

<div id="app" hidden>
<div class="wrap">

<header>
  <div class="htop">
    <div class="eyebrow" data-t="eyebrow"></div>
    <div class="langsw">
      <button type="button" data-lang="zh" aria-pressed="true">繁中</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <h1 data-t="title"></h1>
  <div class="stamp">
    <span><span data-t="periodLabel"></span> <b id="s-range">—</b></span>
    <span id="s-mode" class="pill"></span>
    <button id="refresh" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      <span data-t="refreshBtn"></span>
    </button>
    <span id="rstatus" role="status"></span>
  </div>
</header>

<div class="rangebar" id="rangebar" hidden>
  <span class="lb" data-t="rangePick"></span>
  <span class="seg" id="presets">
    <button type="button" data-days="7"  data-t="p7"></button>
    <button type="button" data-days="30" data-t="p30"></button>
    <button type="button" data-days="0"  data-t="pAll"></button>
  </span>
  <span class="dates">
    <input type="date" id="r-from"><span data-t="rTo"></span><input type="date" id="r-to">
    <button type="button" id="r-apply" data-t="rApply"></button>
  </span>
  <span id="rmsg"></span>
  <span id="rhint"></span>
</div>

<div id="body-slot"><div class="state" data-t="loading"></div></div>

<footer>
  <div data-t="src"></div>
  <div><span data-t="genLabel"></span> <span id="s-gen">—</span></div>
</footer>

</div>
</div>

<script>
/* ── 數據來源 ────────────────────────────────────────────────────────────────
   依序嘗試：先問 ga-proxy.php（伺服器端即時查 GA4），失敗才退回 data.json
   （最後一次人手匯出的快照）。這樣即使 proxy 未設定好或 GA 暫時打不通，
   同事仍然看得到一份標明日期的數據，而不是一個空白頁。               */
const DATA_SOURCES = ['ga-proxy.php', 'data.json'];

/* 存取控制交給伺服器：DirectAdmin 的 Password Protected Directories 已為
   /analytics/ 開啟 Basic Auth，訪客在頁面載入之前就要通過。頁面本身不再
   自設密碼框 —— 兩層密碼只會讓同事被問兩次。 */

/* ⚠️ v51 一上正式網站，注意事項第 3 條（播放次數偏低）就唔再啱，記得改返。
      同一時間第 5 條（tour_end）都要改，因為嗰個事件已經改名做 tutorial_end。 */
/* ── 文案 ──
   凡是句子裡的數字，一律由 data.derived 帶進來。寫死在這裡的話，數據一即時
   更新，文字就會跟旁邊的圖表互相矛盾。                                        */
const T = {
  zh: {
    htmlLang: 'zh-Hant', locale: 'zh-HK', funnelPad: 136, docTitle: 'Audio Journey 數據簡報',
    eyebrow: 'KFBG · 自助語音旅程', title: 'Audio Journey 使用情況簡報',
    periodLabel: '統計期間', refreshBtn: '重新載入數據',
    rangePick: '選擇期間', p7: '最近 7 天', p30: '最近 30 天', pAll: '全部',
    rTo: '至', rApply: '套用',
    rInvalid: '開始日期不可以遲過結束日期。',
    rClamped: '你揀的日子有一部分沒有數據，已經收窄到下面顯示的期間。',
    rSnapshot: '即時數據未接通，只有這一份匯出快照，暫時不能自己選期間。',
    rHint: d => `數據到 ${d}為止。今天的數據明天才有。最近一天的互動數字，分析系統可能仍在處理，未算好時會暫時顯示為 0，算好後會自動更新。`,
    rMismatch: p => `即時數據暫時讀不到。下面是最後一次匯出的快照（${p}），不是你揀的期間。`,
    genLabel: '數據讀取時間（香港時間）：', loading: '正在載入數據…',
    modeLive: '即時數據', modeSnapshot: '人手匯出快照',
    src: '資料來源：Google Analytics 4（資源編號 549905025），數字由 Analytics Data API 讀取。',
    reading: '正在讀取…', updated: '已更新到最新數據。', nochange: '數據未有更新，仍是目前這一份。',
    offline: '裝置目前離線，無法讀取數據。回復連線後請再按一次。',
    failed: e => `讀取數據失敗（${e}）。請稍後再按一次；持續失敗請通知 Ryan。`,
    days: n => `（${n} 天）`, rangeJoin: ' 至 ',
    h_overview: '整體概況', h_note: '閱讀這份數據之前', h_daily: '每天使用情況',
    h_funnel: 'QR code 訪客走到哪一步', h_chapters: '各章節收聽結果',
    h_other: '其他觀察', h_who: '訪客用甚麼裝置、來自哪裡', h_actions: '建議跟進',
    t_devices: '裝置', t_places: '地區', th_device: '裝置', th_place: '地區',
    lede_who: (d, x) => d.devices && d.devices.length
      ? `<strong>${d.devices[0].name.zh} 佔 ${d.devices[0].pct}</strong>，是最多人用的裝置。這個比例值得留意：應用程式要下載音頻離線收聽、又要在鎖上螢幕之後繼續播放，而 iOS 在這兩件事上的限制比 Android 多。日後測試新功能，應該按這個比例分配時間。`
      : '',
    cap_who: '數字為使用次數，佔比以表內各行的總和為基數（分析系統逐個項目各自去重，加起來會略多過整體使用次數）。',
    cap_demo: '<b>沒有年齡與性別。</b>分析系統要開啟 Google Signals，而且人數足夠多，才會提供這兩項；人數少的時候會自動隱去，以免辨認到個人。Signals 已於 8 月 27 日開啟，但它不會補回之前的數據，往後也要累積到一定人數才會出現。地區由 IP 位置推算，用公司網絡或 VPN 會算錯，少量的非香港訪問通常屬於這一類，不宜當成海外訪客。',
    lede_overview: (d, x) => `${d.range.days} 天內共 ${d.summary[0].v} 位訪客使用過。對一次性的園區導賞來說，訪客不重複使用屬於正常。<strong>${x.qrShare} 的使用次數來自掃描園區 QR code</strong>，代表這個入口本身運作正常，人流進得到。`,
    notes: (d, x) => [
      '<b>沒有 8 月 13 日的數字。</b>分析系統 8 月 14 日中午才開始收集，之前的使用情況沒有記錄。',

let LANG = 'zh', DATA = null, lastGenerated = null;
const t = () => T[LANG];
const L = o => (o && typeof o === 'object' && 'zh' in o) ? o[LANG] : o;
const $ = id => document.getElementById(id);
/* #pw 同 #gerr 只在密碼閘未拆之前存在。切語言在開閘前後都會執行，所以寫入文字
   一律經這個 setter，不要直接摸 .textContent —— 否則開閘之後切語言會在半路
   丟錯，LANG 改了但版面沒有重畫。 */
const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── 提示框 ──
   內容在 render() 砌好放進 TIPS，SVG 只帶一個 key。把 HTML 塞進屬性要處理兩重
   跳脫，容易出錯，這樣乾淨。 */
const TIPS = new Map();
let tipSeq = 0;
const tipRef = html => { const k = 't' + (++tipSeq); TIPS.set(k, html); return k; };
const tipRow = (colour, label, value) =>
  `<div class="tr">${colour ? `<i style="background:${colour}"></i>` : ''}` +
  `<span class="lb">${esc(label)}</span><span class="vv">${esc(value)}</span></div>`;

const tipEl = document.createElement('div');
tipEl.id = 'tip'; tipEl.setAttribute('role', 'tooltip');
document.body.appendChild(tipEl);
let tipKey = null;

function showTip(key, x, y) {
  const html = TIPS.get(key);
  if (!html) return hideTip();
  if (tipKey !== key) { tipEl.innerHTML = html; tipKey = key; }
  tipEl.classList.add('on');
  // 先歸零再量：留在上一次的位置量的話，貼近右邊時可用闊度變窄，文字會多折一行，
  // 量到的高度就是錯的。
  tipEl.style.left = '0px'; tipEl.style.top = '0px';
  const r = tipEl.getBoundingClientRect(), pad = 10;
  const vw = document.documentElement.clientWidth || innerWidth || r.width + pad * 2;
  const above = y - r.height - 14;
  tipEl.style.left = Math.max(pad, Math.min(x - r.width / 2, vw - r.width - pad)) + 'px';
  tipEl.style.top = (above < pad ? y + 20 : above) + 'px';   // 太貼近視窗頂就翻到下面
}
function hideTip() { tipEl.classList.remove('on'); tipKey = null; }

/* 用事件委派，因為 render() 每次都會把整個版面重畫。 */
(function () {
  const hitOf = e => (e.target && e.target.closest) ? e.target.closest('[data-tip]') : null;
  document.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;      // 觸控捲動時會連續觸發，會閃
    const h = hitOf(e);
    h ? showTip(h.dataset.tip, e.clientX, e.clientY) : hideTip();
  });
  document.addEventListener('pointerdown', e => {   // 觸控：點一下出，點別處收
    const h = hitOf(e);
    h ? showTip(h.dataset.tip, e.clientX, e.clientY) : hideTip();
  });
  document.addEventListener('focusin', e => {       // 鍵盤：Tab 到就出
    const h = hitOf(e);
    if (!h) return hideTip();
    const r = h.getBoundingClientRect();
    showTip(h.dataset.tip, r.left + r.width / 2, r.top + 8);
  });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('scroll', hideTip, true);   // capture：連圖表自己的橫向捲動都收到
  addEventListener('resize', hideTip);
})();

/* 對不上章節編號的記錄一定要出數，悄悄丟掉會令同事以為圖上就是全部。 */
function unknownNote(d, lang) {
  const u = d.chaptersUnknown;
  return (u && (u.complete + u.abandon)) ? T[lang].unknownCh(u.complete, u.abandon) : '';
}

/* ── 圖表 ── */
function stackedBars(rows, { h = 270, ticks, unitLabel = '', ml = 44, mr = 12, mt = 30, mb = 46, labW = 34 } = {}) {
  const w = 720, top = ticks[ticks.length - 1], pw = w - ml - mr, ph = h - mt - mb;
  const slot = pw / rows.length, bw = Math.min(40, slot * 0.62), unit = ph / top;
  /* 統計期間每過一日就多一條柱，柱與柱之間越來越窄。標籤在疊起來之前先疏鬆，
     柱頂的數字窄到讀不到就收起 —— 數字改由提示框給，資訊沒有少。 */
  const every = Math.max(1, Math.ceil(labW / slot));
  const showVals = slot >= 26;
  let o = unitLabel ? `<text class="ax" x="0" y="${mt - 14}">${esc(unitLabel)}</text>` : '';
  for (const tk of ticks) {
    const y = mt + ph - tk * unit;
    o += `<line class="grid" x1="${ml}" y1="${y.toFixed(1)}" x2="${w - mr}" y2="${y.toFixed(1)}"/>`
       + `<text class="ax" x="${ml - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end">${tk}</text>`;
  }
  rows.forEach((r, i) => {
    const x = ml + i * slot + (slot - bw) / 2, sh = r.strong * unit, sy = mt + ph - sh;
    o += `<rect class="d-strong" x="${x.toFixed(1)}" y="${sy.toFixed(1)}" width="${bw.toFixed(1)}" height="${sh.toFixed(1)}" rx="3"/>`;
    if (r.pale > 0) {
      const hh = Math.max(r.pale * unit - 2, 0);
      o += `<rect class="d-pale" x="${x.toFixed(1)}" y="${(sy - 2 - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3"/>`;
    }
    if (showVals)
      o += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(mt + ph - (r.strong + r.pale) * unit - 8).toFixed(1)}" text-anchor="middle">${r.strong + r.pale}</text>`;
    /* 由最後一條起每 every 條出一個標籤：間距均勻，而且最新一天永遠有標籤。 */
    if ((rows.length - 1 - i) % every === 0)
      o += `<text class="ax" x="${(x + bw / 2).toFixed(1)}" y="${h - mb + 20}" text-anchor="middle">${esc(r.label)}</text>`;
    /* 整條 column 都收 hover，不用準確指住那條窄柱。 */
    o += `<rect class="hit" x="${(ml + i * slot).toFixed(1)}" y="${mt}" width="${slot.toFixed(1)}"`
       + ` height="${(ph + 24).toFixed(1)}" tabindex="0" role="img" aria-label="${esc(r.aria)}" data-tip="${r.key}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${o}</svg>`;
}

function funnelChart(rows) {
  const w = 720, ml = t().funnelPad, mr = 84, bh = 32, gap = 12;
  const h = 8 + rows.length * (bh + gap) - gap + 8, max = rows[0].v || 1;
  let o = '';
  rows.forEach((r, i) => {
    const y = 8 + i * (bh + gap), bw = Math.max((w - ml - mr) * r.v / max, 2), lab = L(r.label);
    o += `<rect class="f${i}" x="${ml}" y="${y}" width="${bw.toFixed(1)}" height="${bh}" rx="4"/>`
       + `<text class="flab" x="${ml - 12}" y="${y + bh / 2 + 5}" text-anchor="end">${esc(lab)}</text>`
       + `<text class="fval" x="${(ml + bw + 10).toFixed(1)}" y="${y + bh / 2 + 5}">${r.v}<tspan class="fpct"> · ${esc(r.pct)}</tspan></text>`
       + `<rect class="hit" x="0" y="${y - gap / 2}" width="${w}" height="${bh + gap}"`
       + ` tabindex="0" role="img" aria-label="${esc(r.aria)}" data-tip="${r.key}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${o}</svg>`;
}

/* ── 靜態文字（閘、頁首、頁尾）── */
function paintChrome() {
  const T_ = t();
  document.documentElement.lang = T_.htmlLang;
  document.title = T_.docTitle;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = T_[el.dataset.t]; if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('.langsw button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
}

/* ── 版面 ── */
function render() {
  const d = DATA; if (!d) return;
  const T_ = t(), x = d.derived || {};
  paintChrome();
  TIPS.clear(); tipSeq = 0; hideTip();   // 整個版面重畫，舊的提示內容要一併清走

  $('s-range').textContent = L(d.range.start) + T_.rangeJoin + L(d.range.end) + T_.days(d.range.days);
  // 🔴 一定要指定 timeZone。generated 帶著 +08:00，但 toLocaleString() 預設換算成
  // 「讀者裝置的時區」—— 同事的手提電腦設成 UTC 或者人在外地，就會見到 8 月 25 日
  // 下午 10:19，其實是香港 8 月 26 日上午 6:19，看起來像份數據舊了一日，
  // 又跟旁邊「至 8 月 24 日」那句對不上。這是一份香港的報告，時間一律用香港時間。
  $('s-gen').textContent = new Date(d.generated).toLocaleString(T_.locale,
    { dateStyle: 'long', timeStyle: 'short', timeZone: 'Asia/Hong_Kong' });
  paintRange(d);
  const mode = $('s-mode');
  mode.textContent = d.live ? T_.modeLive : T_.modeSnapshot;
  mode.className = 'pill' + (d.live ? ' live' : '');

  // 提示框的日期用 iso 由瀏覽器按語言格式化 —— 統計期間會跨月，只帶「日」的話
  // 8 月 3 日同 9 月 3 日會分不開。舊快照沒有 iso 就退回短標籤。
  const fmtDay = (iso, fallback) => fmtDate(iso, true) || fallback;
  const daily = d.daily.map(r => {
    const short = `${r.d} ${L(r.w)}`, head = fmtDay(r.iso, short), tot = r.engaged + r.quick;
    return { label: short, strong: r.engaged, pale: r.quick,
      aria: `${head}，${T_.tipTotal} ${tot}`,
      key: tipRef(`<div class="th">${esc(head)}</div>`
        + tipRow('var(--data-strong)', T_.lg_engaged, r.engaged)
        + tipRow('var(--data-pale)', T_.lg_quick, r.quick)
        + `<div class="tt">${tipRow('', T_.tipTotal, tot)}</div>`) };
  });
  const chapters = d.chapters.map(r => {
    const lab = L(r.label), tot = r.complete + r.abandon;
    return { label: lab, strong: r.complete, pale: r.abandon,
      aria: `${lab}，${T_.tipChTotal} ${tot}`,
      key: tipRef(`<div class="th">${esc(lab)}</div>`
        + tipRow('var(--data-strong)', T_.lg_complete, r.complete)
        + tipRow('var(--data-pale)', T_.lg_abandon, r.abandon)
        + `<div class="tt">${tipRow('', T_.tipChTotal, tot)}</div>`) };
  });
  // 漏斗的重點是每一層跌了多少，所以提示框把流失明寫出來，不用讀者自己減。
  const funnel = d.funnel.map((r, i) => {
    const lab = L(r.label), prev = i ? d.funnel[i - 1].v : null;
    const lost = prev === null ? null : prev - r.v;
    const lostTxt = (lost && prev > 0) ? `${lost} (${Math.round(lost / prev * 100)}%)` : null;
    return Object.assign({}, r, {
      aria: `${lab}，${T_.tipPeople} ${r.v}，${r.pct}`,
      key: tipRef(`<div class="th">${esc(lab)}</div>`
        + tipRow(`var(--f${i})`, T_.tipPeople, r.v)
        + tipRow('', T_.tipShare, r.pct)
        + (lostTxt ? `<div class="tt">${tipRow('', T_.tipDrop, lostTxt)}</div>` : '')) });
  });
  const ticksTo = m => { const step = m <= 12 ? 4 : 10, out = [];
    for (let v = 0; v <= Math.max(Math.ceil(m / step) * step, step); v += step) out.push(v); return out; };
  const maxOf = a => a.length ? Math.max(...a.map(r => r.strong + r.pale)) : 0;

  $('body-slot').innerHTML = `
<section>
  <h2>${T_.h_overview}</h2>
  <div class="tiles">${d.summary.map(s =>
    `<div class="tile"><div class="k">${esc(L(s.k))}</div><div class="v">${esc(s.v)}</div><div class="n">${esc(L(s.n))}</div></div>`).join('')}</div>
  <p class="lede">${T_.lede_overview(d, x)}</p>
</section>

<div class="note">
  <h2>${T_.h_note}</h2>
  <ol>${T_.notes(d, x).map(n => `<li>${n}</li>`).join('')}</ol>
</div>

<section>
  <h2>${T_.h_daily}</h2>
  <div class="card">
    <div class="chart">${stackedBars(daily, { ticks: ticksTo(maxOf(daily)), unitLabel: T_.tipUnit,
      labW: LANG === 'en' ? 42 : 34 })}</div>
    <div class="legend">
      <span><i class="sw" style="background:var(--data-strong)"></i>${T_.lg_engaged}</span>
      <span><i class="sw" style="background:var(--data-pale)"></i>${T_.lg_quick}</span>
    </div>
    <p class="cap">${T_.cap_daily(d, x)}</p>
  </div>
</section>

<section>
  <h2>${T_.h_funnel}</h2>
  <div class="card">
    <div class="chart">${funnelChart(funnel)}</div>
    <p class="cap">${T_.cap_funnel(d.funnel[0].v)}</p>
  </div>
  <p class="lede">${T_.lede_funnel(d, x)}</p>
</section>

<section>
  <h2>${T_.h_chapters}</h2>
  <div class="card">
    <div class="chart">${stackedBars(chapters, { h: 280, ticks: ticksTo(maxOf(chapters)), unitLabel: T_.tipUnitCh })}</div>
    <div class="legend">
      <span><i class="sw" style="background:var(--data-strong)"></i>${T_.lg_complete}</span>
      <span><i class="sw" style="background:var(--data-pale)"></i>${T_.lg_abandon}</span>
    </div>
    <p class="cap">${T_.cap_chapters(d, x)}</p>
  </div>
  <p class="lede">${T_.lede_chapters(d, x)}</p>
</section>

<section>
  <h2>${T_.h_other}</h2>
  <div class="facts">${d.facts.map(f =>
    `<div class="fact"><div class="v">${esc(L(f.v))}</div><div class="k">${esc(L(f.k))}</div><div class="n">${esc(L(f.n))}</div></div>`).join('')}</div>
  <div class="card">
    <div class="tw">
      <table>
        <caption class="cap" style="text-align:left;padding-bottom:10px;">${T_.t_sources}</caption>
        <thead><tr><th>${T_.th_source}</th><th class="n">${T_.th_sessions}</th><th class="n">${T_.th_pct}</th><th class="n">${T_.th_avg}</th></tr></thead>
        <tbody>${d.sources.map(s =>
          `<tr class="${s.hi ? 'hi' : ''}"><td>${esc(L(s.name))}${s.tag ? `<span class="tag">${esc(L(s.tag))}</span>` : ''}</td>` +
          `<td class="n">${s.sessions}</td><td class="n">${esc(s.pct)}</td><td class="n">${esc(s.avg)}</td></tr>`).join('')}</tbody>
      </table>
    </div>

  </div>
</section>

${(d.devices && d.devices.length) || (d.places && d.places.length) ? `
<section>
  <h2>${T_.h_who}</h2>
  <div class="twocol">
    <div class="card"><div class="tw"><table>
      <caption class="cap" style="text-align:left;padding-bottom:10px;">${T_.t_devices}</caption>
      <thead><tr><th>${T_.th_device}</th><th class="n">${T_.th_sessions}</th><th class="n">${T_.th_pct}</th></tr></thead>
      <tbody>${(d.devices || []).map((v, i) =>
        `<tr class="${i === 0 ? 'hi' : ''}"><td>${esc(L(v.name))}</td><td class="n">${v.sessions}</td><td class="n">${esc(v.pct)}</td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="card"><div class="tw"><table>
      <caption class="cap" style="text-align:left;padding-bottom:10px;">${T_.t_places}</caption>
      <thead><tr><th>${T_.th_place}</th><th class="n">${T_.th_sessions}</th><th class="n">${T_.th_pct}</th></tr></thead>
      <tbody>${(d.places || []).map(v =>
        `<tr class="${v.hi ? 'hi' : ''}"><td>${esc(L(v.name))}</td><td class="n">${v.sessions}</td><td class="n">${esc(v.pct)}</td></tr>`).join('')}</tbody>
    </table></div></div>

<section>

/* ── 日期範圍 ──
   原則：所有控制項一律反映「已經載入的那份數據」，不是「剛剛按了甚麼」。
   按下去到數字回來之前，掣如果先跳去新期間，畫面就會出現一個指著舊數字的新標籤。 */
const RANGE = { min: null, max: null };
// 最後一次「使用者指名要哪一段」。訊息由它同收到的數據推導出來，不在載入流程裡
// 另外寫一次 —— 兩個地方各寫一次的話，後寫的會蓋掉先寫的，而蓋走的偏偏是
// 「你見到的不是你揀那段」這句最需要出聲的。
let lastWant = null;
const setMsg = v => { const e = $('rmsg'); if (e) e.textContent = v || ''; };

/* 由 iso 砌出跟版面一致的日期文字。不用 toLocaleDateString 出繁中 —— 它會回
   「8月23日星期日」，跟版面其他地方寫的「8 月 23 日（星期日）」不一致。 */
function fmtDate(iso, withWeekday) {
  if (!iso) return '';
  const dt = new Date(iso + 'T00:00:00');
  if (isNaN(dt)) return '';
  if (LANG === 'en') {
    return dt.toLocaleDateString('en-GB', withWeekday
      ? { weekday: 'short', day: 'numeric', month: 'long' }
      : { day: 'numeric', month: 'long' });
  }
  const base = `${dt.getMonth() + 1} 月 ${dt.getDate()} 日`;
  return withWeekday ? `${base}（星期${'日一二三四五六'[dt.getDay()]}）` : base;
}

const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function isoShift(iso, days) {
  const d = new Date(iso + 'T00:00:00');   // 本地時間的午夜
  d.setDate(d.getDate() + days);
  // 🔴 不可以用 toISOString()：它換算成 UTC，香港是 UTC+8，會退回前一日。
  return isoOf(d);
}
function presetRange(days) {
  if (!RANGE.max || !RANGE.min) return null;
  if (!days) return [RANGE.min, RANGE.max];
  const from = isoShift(RANGE.max, -(days - 1));
  return [from < RANGE.min ? RANGE.min : from, RANGE.max];
}
function busyControls(on) {
  ['r-from', 'r-to', 'r-apply'].forEach(id => { const e = $(id); if (e) e.disabled = on; });
  document.querySelectorAll('#presets button').forEach(b => { b.disabled = on; });
}
function paintRange(d) {
  const bar = $('rangebar'), r = (d && d.range) || {};
  if (!r.from || !r.to) { bar.hidden = true; return; }   // 舊快照沒有這些欄位
  bar.hidden = false;
  RANGE.min = r.min || r.from; RANGE.max = r.max || r.to;
  const live = !!d.live;
  const f = $('r-from'), tt = $('r-to');
  f.min = tt.min = RANGE.min; f.max = tt.max = RANGE.max;
  f.value = r.from; tt.value = r.to;
  busyControls(!live);       // 只有快照的話，揀期間也沒有用 —— 索性關掉並說明原因
  // 幾個預設可能指向同一段：數據只有 11 天時，「最近 30 天」算出來其實就是全部。
  // 逐個標的話會同時著兩粒掣，看起來像壞了。預設由窄至闊排列，取最後一個命中的
  // —— 範圍剛好是全部時，標籤就會講「全部」，最貼近事實。
  const btns = [...document.querySelectorAll('#presets button')];
  let hit = -1;
  btns.forEach((b, i) => {
    const p = presetRange(+b.dataset.days);
    if (p && p[0] === r.from && p[1] === r.to) hit = i;
  });
  btns.forEach((b, i) => { b.setAttribute('aria-pressed', String(i === hit)); });
  setMsg(rangeMsg(d));
  // 為甚麼今天揀不到、最近一天的互動可能暫時是 0 —— 不寫的話，同事會以為出錯。
  const hint = $('rhint');
  if (hint) hint.textContent = live && RANGE.max ? t().rHint(fmtDate(RANGE.max, false)) : '';
}

/* 訊息一律由（數據，最後一次要求）推導，所以換語言、重畫都會自己算返一次。 */
function rangeMsg(d) {
  const T_ = t(), r = d.range || {};
  const missed = !!(lastWant && (r.from !== lastWant.from || r.to !== lastWant.to));
  if (!d.live) return missed ? T_.rMismatch(L(r.start) + T_.rangeJoin + L(r.end)) : T_.rSnapshot;
  return missed ? T_.rClamped : '';
}

/* ── 載入 ── */
async function fetchFirstAvailable(q) {
  let lastErr = null;
  for (const url of DATA_SOURCES) {
    try {
      const res = await fetch(`${url}?${q}t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();
      if (d && d.error) throw new Error(d.message || d.error);
      if (!d || !d.summary) throw new Error('回應格式不正確');
      return d;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('no source');
}

async function load({ manual = false, from = null, to = null } = {}) {
  const btn = $('refresh');
  const want = (from && to) ? { from, to } : null;
  lastWant = want;
  if (manual) {
    btn.disabled = true;
    setText('rstatus', t().reading);
    setMsg('');
    // 立刻標明畫面上的數字是舊那一段，並鎖住控制項，免得連按幾次
    document.body.classList.add('busy');
    busyControls(true);
  }
  try {
    const d = await fetchFirstAvailable(want ? `from=${want.from}&to=${want.to}&` : '');
    const changed = lastGenerated !== null && d.generated !== lastGenerated;
    DATA = d; lastGenerated = d.generated;
    render();
    if (manual) setText('rstatus', changed ? t().updated : t().nochange);
    const got = d.range || {};
    // 只有使用者主動揀過期間才把日子寫進網址：這樣派出去的連結，
    // 冇帶參數的永遠是最新，帶了參數的就是釘死那一段。
    if (want && got.from) {
      const u = new URL(location.href);
      u.searchParams.set('from', got.from); u.searchParams.set('to', got.to);
      history.replaceState(null, '', u);
    }
  } catch (e) {
    const msg = navigator.onLine === false ? t().offline : t().failed(e.message);
    // 判斷準則是「畫面上有沒有真內容」，不是「變數有沒有值」——
    // render() 自己丟錯時 DATA 已經賦了值，靠變數判斷會把錯誤吞掉，永遠停在「載入中」。
    if (!$('body-slot').querySelector('section')) $('body-slot').innerHTML = `<div class="state bad">${esc(msg)}</div>`;
    else if (manual) setText('rstatus', msg);
  } finally {
    document.body.classList.remove('busy');
    if (manual) btn.disabled = false;
    if (DATA) paintRange(DATA); else busyControls(false);
  }
}

$('presets').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const p = presetRange(+b.dataset.days);
  if (p) load({ manual: true, from: p[0], to: p[1] });
});
$('r-apply').addEventListener('click', () => {
  const f = $('r-from').value, tt = $('r-to').value;
  if (!f || !tt) return;
  if (f > tt) { setMsg(t().rInvalid); return; }   // 伺服器一樣會擋，這裡只是即時回應
  load({ manual: true, from: f, to: tt });
});

/* ── 語言 ── */
function setLang(l) {
  LANG = (l === 'en') ? 'en' : 'zh';
  try { localStorage.setItem('aj-lang', LANG); } catch (_) {}
  setText('rstatus', '');
  setMsg('');            // 訊息是即時寫入的，換語言時留在舊語言會很怪
  if (DATA) render(); else paintChrome();
}
document.querySelectorAll('.langsw button').forEach(b =>
  b.addEventListener('click', () => setLang(b.dataset.lang)));

/* 頁面載入即顯示：Basic Auth 已在伺服器層把關。 */
function open_() {
  $('app').hidden = false;
  const qs = new URLSearchParams(location.search);
  const qf = qs.get('from'), qt = qs.get('to');
  load(qf && qt ? { from: qf, to: qt } : {});
}

$('refresh').addEventListener('click', () => load({ manual: true }));

/* ── 啟動 ──
   預設繁中：讀者是 KFBG 香港團隊，而香港辦公室的瀏覽器多數報 en-US。
   英文版由讀者自行切換，選擇會記住。 */
let saved = null;
try { saved = localStorage.getItem('aj-lang'); } catch (_) {}
setLang(saved || 'zh');

open_();
</script>
